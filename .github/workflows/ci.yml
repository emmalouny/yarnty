name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: app — typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Single source of truth, so CI and the dev machine cannot drift.
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The local-schema migration tests. These guard the one bug class that
      # can silently eat a user's unsynced offline rows, so a red run here
      # blocks the merge. See DECISIONS.md section 7.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
