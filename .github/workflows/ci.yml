name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: app — typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Single source of truth, so CI and the dev machine cannot drift.
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The local-schema migration tests. These guard the one bug class that
      # can silently eat a user's unsynced offline rows, so a red run here
      # blocks the merge. See DECISIONS.md section 7.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Deploys only after typecheck, tests and build are green. Cloudflare's own
  # Git integration would run the build but not the tests, so a change that
  # broke the local-schema migrations would ship anyway. Here the suite that
  # protects users' unsynced rows is a release gate, not a report.
  deploy:
    name: deploy to Cloudflare
    needs: app
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci
        working-directory: app

      - name: Build
        run: npm run build
        working-directory: app

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          command: deploy
